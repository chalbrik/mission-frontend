<div class="flex flex-col gap-4 p-4 w-full h-full">

  <app-add-tab
    [title]="'Seria'"
    (add)="openAddCounterCard()"
  ></app-add-tab>

  <div class="grid grid-cols-2 gap-4 w-full">
    @for(counterCard of counterCards(); track counterCard.id){
      <app-counter-card
        [id]="counterCard.id"
        [title]="counterCard.title"
        [streak]="counterCard.streak"
        [record]="counterCard.record"
      ></app-counter-card>
    }
  </div>

<div class="flex flex-row gap-4 p-4 flex-1 min-h-0">
    <div class="flex flex-col gap-4 h-full min-h-0">
      <app-add-tab
        [title]="'Role'"
        (add)="openAddRole()"
      ></app-add-tab>
      <div class="flex-1 min-h-0 flex flex-col gap-4 overflow-y-auto scrollbar-hide">
        @for(role of roles(); track role.id){
          <app-role-card
            class="shrink-0"
            [id]="role.id"
            [title]="role.name"
            [description]="role.note"
            [points]="role.points"
            [isSelected]="role.id === selectedRoleId()"
            [color]="role.color"
            (selected)="onRoleSelected($event)"
          ></app-role-card>
        }
      </div>

    </div>

    @if(selectedRoleId() !== 0){
      <app-goal-table
        [roleId]="selectedRoleId()"
        [color]="selectedRoleColor()"
        (goalSelected)="selectedGoalId.set($event)"
      ></app-goal-table>
    }
    @if(selectedGoalId() !== 0){
      <app-block-table
        [goalId]="selectedGoalId()"
        [color]="selectedRoleColor()"
      ></app-block-table>
    }

  </div>
</div>
