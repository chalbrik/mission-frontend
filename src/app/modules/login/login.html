<div class="min-h-screen flex items-center justify-center bg-gray-100 dark:bg-gray-900">
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="w-full max-w-sm rounded-xl bg-white dark:bg-gray-800 p-8 shadow-md flex flex-col gap-4"
  >
    <h1 class="text-2xl font-semibold text-center text-gray-900 dark:text-gray-100">Logowanie</h1>


    <div class="flex flex-col gap-1">
      <label for="username" class="text-sm font-medium text-gray-700 dark:text-gray-300">
        Nazwa użytkownika
      </label>
      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        class="rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      @if (form.controls.username.touched && form.controls.username.hasError('required')) {
        <span class="text-sm text-red-600">Nazwa użytkownika jest wymagana</span>
      }
    </div>

    <div class="flex flex-col gap-1">
      <label for="password" class="text-sm font-medium text-gray-700 dark:text-gray-300">
        Hasło
      </label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        class="rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 px-3 py-2 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
      @if (form.controls.password.touched && form.controls.password.hasError('required')) {
        <span class="text-sm text-red-600">Hasło jest wymagane</span>
      }
    </div>

    @if (error(); as message) {
      <p class="text-sm text-red-600 text-center">{{ message }}</p>
    }

    <button
      type="submit"
      [disabled]="loading()"
      class="rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed"
    >
      {{ loading() ? 'Logowanie…' : 'Zaloguj się' }}
    </button>
  </form>
</div>
