<div class="flex flex-row items-center justify-between gap-4 border rounded-xl p-4"
     [style.border-color]="identityColor()">
  <div class="flex flex-row items-center gap-3">
    <mat-checkbox
      [checked]="completed()"
      (change)="complete()"
    ></mat-checkbox>
    <p class="text-p-sm text-text-default font-semibold">{{ block().name }}</p>
  </div>
  <div class="flex flex-row items-center gap-2">

    <app-buttons
      [type]="'outline'"
      [iconLeft]="LucidePencil"
      [size]="'small'"
      [rounded]="'big'"
      [textColor]="'text-default'"
      (buttonClick)="editBlock()"
    ></app-buttons>

    <app-buttons
      [type]="'outline'"
      [iconLeft]="LucideTrash2"
      [size]="'small'"
      [rounded]="'big'"
      [textColor]="'text-default'"
      (buttonClick)="deleteBlock()"
    ></app-buttons>

  </div>
</div>
