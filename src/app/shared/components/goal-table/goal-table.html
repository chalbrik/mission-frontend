<div class="h-full w-96 border p-4 rounded-xl flex flex-col gap-6 bg-surface-background-default"
     [style.border-color]="identityColor()">
  <app-add-tab
    [title]="'Cele'"
    (add)="openAddGoal()"
  ></app-add-tab>
  <div class="flex flex-col gap-6 overflow-auto scrollbar-hide">
    @for(goal of goals(); track goal.id){
      <app-goal-card
        [goal]="goal"
        [color]="color()"
        [isSelected]="goal.id === selectedGoalId()"
        (selected)="onGoalSelected($event)"
      ></app-goal-card>
    }
  </div>

</div>
